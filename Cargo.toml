[package]
name = "simple-server"
version = "0.1.0"
edition = "2024"
description = "A modular foundation for Axum-based Rust services"
repository = "https://github.com/lelloman/simple-server"
readme = "README.md"
publish = false

[features]
extract = ["dep:http"]
auth-cookies = ["auth", "dep:cookie"]
rate-limit-async = ["rate-limit", "dep:tokio", "tokio/rt"]
rate-limit = ["dep:http", "dep:http-body", "dep:tower-layer", "dep:tower-service", "dep:pin-project-lite"]
auth = ["dep:http", "dep:tower-layer", "dep:tower-service"]
default = ["http"]
http = ["dep:axum", "dep:tower-service"]
task-policies = ["tasks"]
task-scheduling = ["tasks", "dep:cron", "dep:chrono", "dep:rand"]
tasks = ["lifecycle", "tokio/rt"]
lifecycle = ["dep:tokio", "dep:futures-util"]
logging = ["dep:tracing", "dep:tracing-subscriber"]
correlation = ["http", "dep:tokio", "dep:rand"]
body-limit = ["http", "dep:tower-layer"]
response-headers = ["dep:http"]
health = ["dep:http", "dep:tower-service"]
cors = ["dep:http", "dep:tower-layer", "dep:tower-service", "dep:tower-http", "dep:pin-project-lite"]
http-tracing = ["http", "dep:tracing", "dep:http-body"]
http2 = ["http", "axum/http2"]
macros = ["http", "axum/macros"]
multipart = ["http", "axum/multipart"]
ws = ["http", "axum/ws"]

[dependencies]
cookie = { version = "0.18", features = ["percent-encode"], optional = true }
cron = { version = "0.15", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
pin-project-lite = { version = "0.2", optional = true }
tower-http = { version = "0.6", default-features = false, features = ["cors"], optional = true }
http = { version = "1", optional = true }
tower-layer = { version = "0.3", optional = true }
http-body = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
axum = { version = "=0.8.9", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
tokio = { version = "1", features = ["macros", "net", "signal", "sync", "time"], optional = true }
tower-service = { version = "0.3", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "json"], optional = true }

[dev-dependencies]
bytes = "1"
governor = { version = "0.10", default-features = false, features = ["std"] }
governor_06 = { package = "governor", version = "0.6", default-features = false, features = ["std"] }
governor_08 = { package = "governor", version = "0.8", default-features = false, features = ["std"] }
http-body-util = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "test-util"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
log = "0.4"

[[example]]
name = "lifecycle"
required-features = ["lifecycle", "http"]

[[example]]
name = "signals"
required-features = ["lifecycle"]

[[example]]
name = "logging"
required-features = ["logging"]

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "tasks"
required-features = ["tasks"]

[[example]]
name = "scheduler"
required-features = ["task-scheduling"]

[[example]]
name = "dynamic_cron"
required-features = ["task-scheduling"]

[[example]]
name = "policy_snapshot"
required-features = ["task-policies"]
