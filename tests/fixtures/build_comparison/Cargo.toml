[package]
name = "simple-server-build-comparison"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
source = ["simple-server/web", "simple-server/lifecycle", "dep:tokio"]
engine = ["simple-server/engine-web"]

[dependencies]
simple-server = { package = "lelloman-simple-server", path = "../../..", default-features = false }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread"] }
