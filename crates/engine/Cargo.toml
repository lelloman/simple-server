[package]
name = "lelloman-simple-server-engine"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "2"

[lib]
name = "simple_server_engine"
crate-type = ["cdylib"]

[dependencies]
simple-server-abi = { package = "lelloman-simple-server-abi", path = "../engine-abi", version = "=0.2.0" }
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "charset", "http2"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
